services:
  # ── Backend API + Frontend Static Server ──────────────────────
  - type: web
    name: codefix-app
    runtime: node
    rootDir: backend
    buildCommand: cd .. && npm install && npm run build && cd backend && npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
    plan: free
